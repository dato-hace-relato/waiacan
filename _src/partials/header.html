  <a class="skip-link" href="#main">{{skip_link}}</a>

  <header class="site-header">
    <div class="container header-inner">
      <!-- Logo: the icon is an image; "WAIACAN" is live text in Sofia Sans SemiBold (see .brand-word). -->
      <a href="{{home_href}}" class="brand" aria-label="{{home_label}}">
        <img class="brand-icon" src="{{root}}images/logo/waiacan-icon-white-yellow.svg?v=3" alt="" width="375" height="427">
        <span class="brand-word" aria-hidden="true">W<span class="brand-ai">AI</span>ACAN</span>
      </a>
      <!-- Section links point at the home page ({{home_anchor}} is empty there, "../" on inner pages). -->
      <nav id="site-nav" class="site-nav" aria-label="{{nav_label}}">
        <a href="{{home_anchor}}#approach">{{nav_approach}}</a>
        <a href="{{home_anchor}}#expertise">{{nav_expertise}}</a>
        <a href="{{projects_href}}"{{projects_current}}>{{nav_projects}}</a>
        <a href="{{home_anchor}}#why">{{nav_why}}</a>
        <a href="{{home_anchor}}#contact" class="btn btn-primary btn-sm">{{nav_cta}}</a>
      </nav>
      <div class="header-actions">
        <a href="{{alt_href}}" class="lang-switch" hreflang="{{alt_lang}}" lang="{{alt_lang}}" data-set-lang="{{alt_lang}}" aria-label="{{alt_name}}">{{alt_label}}</a>
        <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="{{menu_open}}" data-label-open="{{menu_open}}" data-label-close="{{menu_close}}">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>
